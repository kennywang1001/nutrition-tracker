services:
  db:
    image: postgres:16.15
    environment:
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
      POSTGRES_DB: wallet
    ports:
      # 主機用 5433，避免跟開發機上其他專案的 PostgreSQL 撞埠。
      # 容器之間仍走 5432（見下面 api 的 DATABASE_URL），CI 也用 5432（runner 是乾淨的）。
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://wallet:wallet@db:5432/wallet
      # 明顯是開發用的值——不是留一個沒人守的預設值，是刻意寫死在這裡，
      # 讓「這是開發環境」一眼就看得出來。這裡的重點是「必須有值才能啟動」
      # （compose 沒設這行，容器會直接因為 JWT_SECRET 缺失而啟動失敗），
      # 不是「不准有值」。不可以是 "dev-secret-change-me-in-production"
      # ——那個字串在公開的 GitHub repo 裡，Settings 會直接拒絕啟動。
      JWT_SECRET: local-docker-compose-dev-only-not-a-real-secret
      PHOTO_DIR: /app/data/photos
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - photos:/app/data/photos
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
  photos:
